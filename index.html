<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageSlide Player</title>
<link rel="manifest" href="manifest.json">

<meta
    name="theme-color"
    content="#2563eb">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/play.css">
</head>
<body>

<section id="homeScreen">
  <div class="background">
    <div class="glass-card">
      <div class="logo">🖼️</div>
      <h1>ImageSlide Player</h1>
      <p>Créer des diaporamas animés</p>

      <label class="form-label">Choisir un dossier</label>
      <input id="folder" type="file" webkitdirectory multiple class="form-control">

      <div id="folderName" class="folder-name">Aucun dossier sélectionné</div>

      <div class="preview">
        <img id="previewImage" alt="Aperçu">
      </div>

      <div id="stats" class="stats"></div>

      <label class="form-label mt-3">Durée (secondes)</label>
      <input id="duration" type="number" value="3" min="1" max="60" class="form-control">

      <label class="form-label mt-3">Transition</label>
      <select id="transition" class="form-select">
        <option value="random">Aléatoire</option>
        <option value="fade">Fondu</option>
        <option value="zoom">Zoom</option>
        <option value="slide">Slide</option>
        <option value="flip">Flip</option>
      </select>

      <button id="start" disabled class="btn btn-primary w-100 mt-4">▶ Lancer</button>
      <a href="#" id="aboutLink" class="about-link">À propos</a>
    </div>
  </div>
</section>

<section id="playerScreen" class="d-none">

    <div class="player">

        <div class="player-top">

            <button id="playerHomeBtn">
                🏠
            </button>

            <span id="counter">
                1 / 1
            </span>

        </div>


        <div class="image-container">

            <img
                id="slideImageCurrent"
                class="slide-image"
                alt="Image actuelle">

            <img
                id="slideImageNext"
                class="slide-image"
                alt="Image suivante">

        </div>

        <div class="progress-container">

            <div
                id="progressBar"
                class="progress-bar">
            </div>

        </div>


        <div class="time-info">

            <span id="currentTime">
                0:00
            </span>

            <span id="totalTime">
                0:03
            </span>

        </div>


        <div class="controls">

            <button id="previousBtn">
                ⏮
            </button>

            <button id="pauseBtn">
                ⏸
            </button>

            <button id="nextBtn">
                ⏭
            </button>

            <button id="restartBtn">
                🔁
            </button>

            <button id="fullscreenBtn">
                ⛶
            </button>

        </div>

    </div>

</section>

<section id="aboutScreen" class="d-none about-screen">
  <div class="about-card">
    <h2>À propos</h2>
    <p>ImageSlide Player est un lecteur de diaporamas animé.</p>
    <button id="backBtn" class="btn btn-light">Retour</button>
  </div>
</section>

<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/animations.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
